spring.application.name=educore
server.port=${SERVER_PORT:8080}

# MongoDB: override with the MONGODB_URI environment variable
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/educore}
spring.data.mongodb.auto-index-creation=true

# Comma separated list of frontend origins allowed by CORS
educore.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Development sample data (only inserted into an EMPTY database; records are labelled DEMO-*)
educore.seed.enabled=${SEED_SAMPLE_DATA:true}
